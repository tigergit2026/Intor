<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代出席信息登记系统</title>
<style>
/* ============ Base Reset ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  line-height: 1.6;
  min-height: 100vh;
}

/* ============ Layout ============ */
.container { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }

.page-header {
  text-align: center;
  padding: 28px 0 20px;
  border-bottom: 2px solid #2563eb;
  margin-bottom: 24px;
}
.page-header h1 { font-size: 1.6rem; font-weight: 700; color: #1e3a5f; letter-spacing: 1px; }
.page-header p { font-size: .82rem; color: #64748b; margin-top: 6px; }

/* ============ Tabs ============ */
.tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid #e2e8f0; }
.tab-btn {
  padding: 10px 28px;
  border: none;
  background: none;
  font-size: .95rem;
  font-weight: 500;
  color: #64748b;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all .2s;
}
.tab-btn:hover { color: #2563eb; }
.tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ============ Form Card ============ */
.card {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  padding: 24px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: #1e3a5f;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #f1f5f9;
}

/* ============ Form Fields ============ */
.form-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.form-row label { font-size: .9rem; font-weight: 600; color: #334155; white-space: nowrap; }
.form-row input[type="date"],
.form-row input[type="number"],
.form-row select {
  padding: 7px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: .9rem;
  color: #1e293b;
  background: #fff;
  outline: none;
  transition: border-color .2s;
}
.form-row input[type="date"]:focus,
.form-row input[type="number"]:focus,
.form-row select:focus { border-color: #2563eb; }
.form-row .week-badge {
  display: inline-block;
  padding: 5px 14px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 6px;
  font-size: .85rem;
  font-weight: 600;
  color: #2563eb;
}

/* ============ Semester Start ============ */
.semester-setting {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: .8rem;
  color: #64748b;
  margin-bottom: 16px;
}
.semester-setting input { padding: 4px 8px; font-size: .8rem; border: 1px solid #cbd5e1; border-radius: 4px; }

/* ============ Course Entry ============ */
.course-entry {
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 18px;
  margin-bottom: 16px;
  background: #f8fafc;
  position: relative;
}
.course-entry-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.course-entry-title { font-size: .95rem; font-weight: 600; color: #1e3a5f; }
.course-entry-index {
  display: inline-block;
  width: 24px; height: 24px;
  line-height: 24px;
  text-align: center;
  background: #2563eb;
  color: #fff;
  border-radius: 50%;
  font-size: .78rem;
  font-weight: 700;
  margin-right: 8px;
}
.btn-delete-course {
  background: #fee2e2;
  color: #dc2626;
  border: none;
  padding: 4px 12px;
  border-radius: 5px;
  font-size: .8rem;
  cursor: pointer;
  transition: background .2s;
}
.btn-delete-course:hover { background: #fecaca; }

.course-select-wrap { margin-bottom: 14px; }
.course-select-wrap label { font-size: .88rem; font-weight: 600; color: #334155; display: block; margin-bottom: 5px; }
.course-select-wrap select {
  width: 100%;
  max-width: 480px;
  padding: 8px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: .9rem;
  color: #1e293b;
  background: #fff;
  cursor: pointer;
}
.course-select-wrap select:focus { border-color: #2563eb; }

/* Course Info Display */
.course-info {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px 20px;
  padding: 14px;
  background: #fff;
  border-radius: 6px;
  border: 1px solid #e2e8f0;
  margin-bottom: 14px;
}
.info-item { font-size: .85rem; }
.info-item .label { color: #64748b; font-weight: 500; margin-bottom: 2px; }
.info-item .value { color: #1e293b; font-weight: 600; }
.info-item .value.highlight { color: #2563eb; }
.info-item .value.duration { color: #0d9488; font-size: .95rem; }
.info-item .value.total { color: #16a34a; font-size: 1rem; }
.info-item .value.pay { color: #d97706; font-size: 1rem; }

/* Class date & rate row */
.class-rate-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.class-rate-row .field { display: flex; align-items: center; gap: 8px; }
.class-rate-row .field label { font-size: .88rem; font-weight: 600; color: #334155; white-space: nowrap; }
.class-rate-row .field input[type="date"],
.class-rate-row .field input[type="number"] {
  padding: 7px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: .9rem;
  color: #1e293b;
  background: #fff;
  outline: none;
  transition: border-color .2s;
}
.class-rate-row .field input:focus { border-color: #2563eb; }
.class-rate-row .rate-input { display: flex; align-items: center; gap: 6px; }
.class-rate-row .rate-input span { font-size: .82rem; color: #64748b; white-space: nowrap; }

/* Activity Radio */
.activity-group { margin-bottom: 14px; }
.activity-group > label { font-size: .88rem; font-weight: 600; color: #334155; display: block; margin-bottom: 6px; }
.radio-wrap { display: flex; gap: 20px; }
.radio-wrap label { display: flex; align-items: center; gap: 5px; font-size: .88rem; cursor: pointer; color: #475569; }
.radio-wrap input[type="radio"] { cursor: pointer; accent-color: #2563eb; }

/* Remarks */
.remarks-wrap { margin-bottom: 8px; }
.remarks-wrap label { font-size: .88rem; font-weight: 600; color: #334155; display: block; margin-bottom: 5px; }
.remarks-wrap textarea {
  width: 100%;
  min-height: 60px;
  padding: 8px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: .88rem;
  font-family: inherit;
  color: #1e293b;
  resize: vertical;
  outline: none;
  transition: border-color .2s;
}
.remarks-wrap textarea:focus { border-color: #2563eb; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 9px 24px;
  border: none;
  border-radius: 6px;
  font-size: .9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  text-decoration: none;
}
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
.btn-secondary:hover { background: #e2e8f0; }
.btn-teal { background: #0d9488; color: #fff; }
.btn-teal:hover { background: #0f766e; }
.btn-danger { background: #fee2e2; color: #dc2626; }
.btn-danger:hover { background: #fecaca; }
.btn-sm { padding: 5px 14px; font-size: .82rem; }
.btn-block { width: 100%; }
.actions-bar { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
.actions-bar .btn { min-width: 120px; }

.add-course-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 10px;
  border: 2px dashed #cbd5e1;
  border-radius: 8px;
  background: transparent;
  font-size: .9rem;
  color: #64748b;
  cursor: pointer;
  transition: all .2s;
  margin-bottom: 16px;
}
.add-course-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

/* ============ Summary ============ */
.summary-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
.summary-controls .left { display: flex; align-items: center; gap: 12px; }
.summary-controls .right { display: flex; gap: 8px; }

.week-group {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  margin-bottom: 16px;
  overflow: hidden;
}
.week-group-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
}
.week-group-header input[type="checkbox"] { width: 18px; height: 18px; accent-color: #2563eb; cursor: pointer; }
.week-group-header .week-title { font-size: 1rem; font-weight: 600; color: #1e3a5f; }
.week-group-header .week-total { margin-left: auto; font-size: .85rem; color: #0d9488; font-weight: 600; }
.week-group-body { padding: 0; }
.week-group-body table { width: 100%; border-collapse: collapse; }

.week-group-body th,
.week-group-body td {
  padding: 8px 12px;
  text-align: center;
  font-size: .82rem;
  border-bottom: 1px solid #f1f5f9;
}
.week-group-body th {
  background: #f8fafc;
  font-weight: 600;
  color: #475569;
  white-space: nowrap;
}
.week-group-body td { color: #334155; }
.week-group-body td.left-align { text-align: left; }
.week-group-body .row-action { text-align: center; }
.empty-summary {
  text-align: center;
  padding: 60px 20px;
  color: #94a3b8;
  font-size: .95rem;
}
.summary-total-bar {
  display: flex;
  justify-content: flex-end;
  gap: 30px;
  padding: 12px 18px;
  background: #eff6ff;
  border-top: 2px solid #bfdbfe;
  font-size: .88rem;
}
.summary-total-bar .label { color: #475569; }
.summary-total-bar .value { font-weight: 700; color: #2563eb; }

/* ============ Print Styles ============ */
@media print {
  body { background: #fff; font-size: 12px; }
  .container { max-width: 100%; padding: 0; }
  .no-print { display: none !important; }
  .page-header { border-bottom: 2px solid #333; }
  .page-header h1 { font-size: 1.3rem; }
  .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
  .course-entry { border: 1px solid #ccc; page-break-inside: avoid; }
  .course-info { border: 1px solid #ccc; }
  .btn, .add-course-btn, .btn-delete-course, .tab-btn, .semester-setting { display: none !important; }
  .tabs { display: none; }
  .tab-content { display: block !important; }
  .week-group { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
  .summary-controls { display: none !important; }
  .week-group-header input[type="checkbox"] { display: none; }
  .week-group-body th { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .summary-total-bar { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* Print-only signature area */
  .print-signature {
    display: flex !important;
    justify-content: space-between;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #333;
  }
  .print-signature .sig-block { text-align: left; }
  .print-signature .sig-block .sig-label { font-size: .85rem; color: #333; margin-bottom: 30px; }
  .print-signature .sig-block .sig-line { width: 200px; border-bottom: 1px solid #333; height: 1px; margin-bottom: 4px; }
  .print-signature .sig-block .sig-hint { font-size: .72rem; color: #999; }

  /* Print form layout */
  .print-form-header { display: block !important; margin-bottom: 16px; }
}

/* Print-only elements (hidden on screen) */
.print-only { display: none; }
.print-signature { display: none; }
.print-form-header { display: none; }

/* ============ Responsive ============ */
@media (max-width: 640px) {
  .container { padding: 12px 10px 60px; }
  .page-header h1 { font-size: 1.3rem; }
  .card { padding: 16px; }
  .course-info { grid-template-columns: 1fr; }
  .week-group-body { overflow-x: auto; }
  .week-group-body table { min-width: 1000px; }
  .actions-bar { flex-direction: column; }
  .actions-bar .btn { width: 100%; }
  .summary-controls { flex-direction: column; align-items: stretch; }
}

/* ============ Misc ============ */
.fade-in { animation: fadeIn .25s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 28px;
  border-radius: 8px;
  font-size: .88rem;
  z-index: 9999;
  opacity: 0;
  transition: opacity .3s, transform .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.toast.success { background: #16a34a; }
.toast.error { background: #dc2626; }

/* ============ Login Screen ============ */
#login-screen {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #eff6ff 0%, #f1f5f9 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.login-card {
  width: 100%;
  max-width: 400px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 10px 40px rgba(30, 58, 95, .15);
  padding: 40px 36px 32px;
}
.login-card .login-logo {
  width: 56px;
  height: 56px;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, #2563eb, #0d9488);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.5rem;
  font-weight: 700;
}
.login-card h1 { text-align: center; font-size: 1.35rem; color: #1e3a5f; letter-spacing: 1px; margin-bottom: 6px; }
.login-card .login-sub { text-align: center; font-size: .8rem; color: #64748b; margin-bottom: 28px; }
.login-field { margin-bottom: 16px; }
.login-field label { display: block; font-size: .85rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
.login-field input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: .92rem;
  color: #1e293b;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  background: #fff;
}
.login-field input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
.btn-login {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  font-size: .98rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity .2s, transform .1s;
}
.btn-login:hover { opacity: .92; }
.btn-login:active { transform: scale(.985); }
.login-error {
  margin-top: 12px;
  font-size: .82rem;
  color: #dc2626;
  text-align: center;
  min-height: 20px;
}
.login-hint { margin-top: 18px; padding-top: 14px; border-top: 1px dashed #e2e8f0; font-size: .75rem; color: #94a3b8; text-align: center; line-height: 1.7; }

/* ============ Top Bar (user info) ============ */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 10px 16px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  font-size: .85rem;
}
.top-bar .user-info { color: #475569; }
.top-bar .user-info strong { color: #2563eb; }
.btn-logout {
  padding: 6px 16px;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  background: #f8fafc;
  color: #dc2626;
  font-size: .82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
}
.btn-logout:hover { background: #fef2f2; border-color: #fca5a5; }
</style>
</head>
<body>

<!-- ====== Login Screen ====== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">代</div>
    <h1>代出席信息登记系统</h1>
    <p class="login-sub">Substitute Attendance Information System</p>
    <div class="login-field">
      <label for="login-username">用户名</label>
      <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-field">
      <label for="login-password">登录密码</label>
      <input type="password" id="login-password" placeholder="请输入登录密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">登 录</button>
    <div class="login-error" id="login-error"></div>
    <div class="login-hint">系统仅限授权人员使用<br>登记数据由管理员统一汇总</div>
  </div>
</div>

<div class="container" id="app-container" style="display:none;">

  <!-- ====== Top Bar ====== -->
  <div class="top-bar no-print">
    <span class="user-info">当前用户：<strong id="current-username">—</strong></span>
    <button class="btn-logout" onclick="doLogout()">退出登录</button>
  </div>

  <!-- ====== Page Header ====== -->
  <div class="page-header">
    <h1>代替出席信息确认</h1>
    <p>Substitute Attendance Information Confirmation</p>
  </div>

  <!-- ====== Tabs ====== -->
  <div class="tabs no-print">
    <button class="tab-btn active" data-tab="register" onclick="switchTab('register')">信息登记</button>
    <button class="tab-btn" data-tab="summary" id="tab-btn-summary" onclick="switchTab('summary')">汇总登记</button>
  </div>

  <!-- ================================================================ -->
  <!--                    TAB 1: Information Registration               -->
  <!-- ================================================================ -->
  <div id="tab-register" class="tab-content active">

    <!-- Date & Week -->
    <div class="card">
      <div class="card-title">基本信息</div>
      <div class="semester-setting no-print" id="semester-setting">
        <label>学期起始日：</label>
        <input type="date" id="semester-start" value="2026-07-27">
      </div>
      <div class="form-row">
        <label>本周开始日期</label>
        <input type="date" id="reg-date" onchange="updateWeek()">
        <label>第几周</label>
        <span class="week-badge" id="reg-week">—</span>
      </div>
    </div>

    <!-- Course Entries -->
    <div class="card">
      <div class="card-title">课程登记</div>
      <div id="course-entries">
        <!-- dynamic entries -->
      </div>
      <button class="add-course-btn no-print" onclick="addCourseEntry()">
        <span>+&nbsp;增加一门课程</span>
      </button>
    </div>

    <!-- Actions -->
    <div class="card no-print">
      <div class="actions-bar">
        <button class="btn btn-secondary" onclick="printRegisterForm()">打印</button>
        <button class="btn btn-primary" onclick="submitRegistration()">提交</button>
        <button class="btn btn-danger" onclick="clearForm()">清空</button>
      </div>
    </div>

  </div><!-- /tab-register -->

  <!-- ================================================================ -->
  <!--                    TAB 2: Summary Registration                    -->
  <!-- ================================================================ -->
  <div id="tab-summary" class="tab-content">

    <div class="summary-controls no-print">
      <div class="left">
        <input type="checkbox" id="select-all-weeks" onchange="toggleAllWeeks(this)">
        <label for="select-all-weeks" style="font-size:.88rem;font-weight:600;cursor:pointer;color:#334155;">全选</label>
      </div>
      <div class="right">
        <button class="btn btn-teal btn-sm" onclick="exportSelectedPDF()">导出选中 PDF</button>
        <button class="btn btn-secondary btn-sm" onclick="exportAllPDF()">导出全部 PDF</button>
        <button class="btn btn-danger btn-sm" onclick="clearAllRecords()">清空全部</button>
      </div>
    </div>

    <div id="summary-container">
      <!-- dynamic summary content -->
    </div>

  </div><!-- /tab-summary -->

  <!-- ====== Print-only form header ====== -->
  <div class="print-form-header">
    <div style="text-align:center;margin-bottom:20px;">
      <h2 style="font-size:1.2rem;margin-bottom:6px;">代替出席信息确认</h2>
      <p style="font-size:.82rem;color:#666;">登记表打印件</p>
    </div>
  </div>

</div><!-- /container -->

<!-- ====== Toast ====== -->
<div class="toast" id="toast"></div>

<script>
/* ====================================================================== */
/*  USER ACCOUNTS & AUTH                                                   */
/* ====================================================================== */
const USERS = {
  "User1": { password: "123888", role: "user",  label: "User1（信息登记）" },
  "Admin": { password: "889900", role: "admin", label: "Admin（管理员）" }
};
const SESSION_KEY = "sub_attendance_session";
let currentUser = null;

function getSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
  catch { return null; }
}
function setSession(u) { localStorage.setItem(SESSION_KEY, JSON.stringify({ username: u.username, role: u.role, label: u.label, loginAt: Date.now() })); }
function clearSession() { localStorage.removeItem(SESSION_KEY); }

function doLogin() {
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  const err = document.getElementById("login-error");

  const user = USERS[username];
  if (!user) { err.textContent = "用户名不存在"; return; }
  if (user.password !== password) { err.textContent = "密码错误，请重试"; return; }

  currentUser = { username: username, role: user.role, label: user.label };
  setSession(currentUser);
  enterApp();
}

function doLogout() {
  clearSession();
  currentUser = null;
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app-container").style.display = "none";
  document.getElementById("login-password").value = "";
  document.getElementById("login-error").textContent = "";
  document.getElementById("login-username").focus();
}

function enterApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-container").style.display = "block";
  document.getElementById("current-username").textContent = currentUser.label || currentUser.username;
  applyPermission();
  // Reset course entries so the first entry matches the current user's role
  document.getElementById("course-entries").innerHTML = "";
  courseEntryCount = 0;
  addCourseEntry();
  switchTab("register");
}

/* Apply role-based permissions to the UI */
function applyPermission() {
  const isAdmin = currentUser && currentUser.role === "admin";

  // 汇总登记 tab：仅管理员可见
  document.getElementById("tab-btn-summary").style.display = isAdmin ? "" : "none";

  // 学期起始日：仅管理员可见
  document.getElementById("semester-setting").style.display = isAdmin ? "" : "none";

  // 每门课程的"单位时间酬劳"填写项：仅管理员可见
  document.querySelectorAll(".rate-field").forEach(el => {
    el.style.display = isAdmin ? "" : "none";
  });
}

/* Effective unit rate for an entry: fixed 30 AUD/h for user role */
function effectiveRate(idx) {
  if (currentUser && currentUser.role !== "admin") return 30;
  return parseFloat(document.getElementById("rate-" + idx).value) || 0;
}

/*  COURSE DATA (built-in)                                                */
/* ====================================================================== */
const COURSE_DATA = [
  { code: "MGMT2040", name: "Workplace Relations",               tutorial: "Tutorial_1-2", day: "Tuesday",   start: "11:00", end: "13:00" },
  { code: "MGMT3015", name: "Managing Performance and Rewards", tutorial: "Tutorial_1-4", day: "Wednesday", start: "11:00", end: "13:00" },
  { code: "MQBS3020", name: "Contemporary Business Challenges",  tutorial: "Tutorial_1-6", day: "Wednesday", start: "16:30", end: "18:00" },
];

/**
 * Compute duration (hours) from start/end time strings like "11:00"/"13:00".
 */
function calcDuration(start, end) {
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  return (eh + em / 60) - (sh + sm / 60);
}

/* ====================================================================== */
/*  STATE                                                                 */
/* ====================================================================== */
let courseEntryCount = 0;
const STORAGE_KEY = "sub_attendance_records";

/* ====================================================================== */
/*  TAB SWITCHING                                                         */
/* ====================================================================== */
function switchTab(tab) {
  // Permission guard: user role cannot access summary
  if (tab === "summary" && (!currentUser || currentUser.role !== "admin")) {
    tab = "register";
  }
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.getElementById("tab-register").classList.toggle("active", tab === "register");
  document.getElementById("tab-summary").classList.toggle("active", tab === "summary");
  if (tab === "summary") renderSummary();
}

/* ====================================================================== */
/*  WEEK CALCULATION                                                      */
/* ====================================================================== */
function updateWeek() {
  const dateVal = document.getElementById("reg-date").value;
  const startVal = document.getElementById("semester-start").value;
  const badge = document.getElementById("reg-week");
  if (!dateVal || !startVal) { badge.textContent = "—"; return; }
  const d = new Date(dateVal);
  const s = new Date(startVal);
  const diffMs = d - s;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays < 0) { badge.textContent = "学期未开始"; return; }
  const week = Math.floor(diffDays / 7) + 1;
  badge.textContent = "第 " + week + " 周";
}

document.getElementById("semester-start").addEventListener("change", updateWeek);

      <div class="info-item"><div class="label">课程名称</div><div class="value" id="info-name-${idx}">—</div></div>
      <div class="info-item"><div class="label">Tutorial</div><div class="value" id="info-tutorial-${idx}">—</div></div>
      <div class="info-item"><div class="label">上课时间</div><div class="value highlight" id="info-time-${idx}">—</div></div>
      <div class="info-item"><div class="label">上课时长</div><div class="value duration" id="info-duration-${idx}">—</div></div>

      <div class="info-item"><div class="label">额外工作时长</div><div class="value" id="info-extra-${idx}">0 小时</div></div>
      <div class="info-item"><div class="label">总工作时长</div><div class="value total" id="info-total-${idx}">—</div></div>

    </div>

      <label>是否有当堂课程活动</label>
      <div class="radio-wrap">
        <label><input type="radio" name="activity-${idx}" value="yes" onchange="onActivityChange(${idx})"> 是（+1 小时）</label>
        <label><input type="radio" name="activity-${idx}" value="no" onchange="onActivityChange(${idx})" checked> 否</label>

function removeCourseEntry(idx) {
  const entry = document.getElementById("entry-" + idx);
  if (entry) entry.remove();
}

function onCourseSelect(idx) {
  const sel = document.getElementById("course-select-" + idx);
  const val = sel.value;
  const infoBox = document.getElementById("course-info-" + idx);
  const actBox = document.getElementById("activity-group-" + idx);

  if (val === "") {
    infoBox.style.display = "none";
    actBox.style.display = "none";
    return;
  }

  const c = COURSE_DATA[parseInt(val)];
  const duration = calcDuration(c.start, c.end);

  document.getElementById("info-code-" + idx).textContent = c.code;
  document.getElementById("info-name-" + idx).textContent = c.name;
  document.getElementById("info-tutorial-" + idx).textContent = c.tutorial;
  document.getElementById("info-time-" + idx).textContent = c.day + " " + c.start + " - " + c.end;
  document.getElementById("info-duration-" + idx).textContent = duration + " 小时";

  infoBox.style.display = "grid";
  actBox.style.display = "block";

  onActivityChange(idx);
}

function onActivityChange(idx) {
  const radios = document.getElementsByName("activity-" + idx);
  let hasActivity = false;
  for (const r of radios) { if (r.checked && r.value === "yes") hasActivity = true; }

  const sel = document.getElementById("course-select-" + idx);
  const val = sel.value;
  if (val === "") return;

  const c = COURSE_DATA[parseInt(val)];
  const duration = calcDuration(c.start, c.end);
  const extra = hasActivity ? 1 : 0;
  const total = duration + extra;

  document.getElementById("info-activity-" + idx).textContent = hasActivity ? "是" : "否";
  document.getElementById("info-extra-" + idx).textContent = extra + " 小时";
  document.getElementById("info-total-" + idx).textContent = total + " 小时";

  updatePayment(idx);
}

/* Triggered when rate or class date changes */
function onRateChange(idx) {
  updatePayment(idx);
}

/* 本课程酬劳 = 单位时间酬劳 × (上课时长 + 额外工作时长) */
function updatePayment(idx) {
  const sel = document.getElementById("course-select-" + idx);
  const val = sel.value;
  if (val === "") return;

  const rate = effectiveRate(idx);
  const c = COURSE_DATA[parseInt(val)];
  const duration = calcDuration(c.start, c.end);

  let hasActivity = false;
  const radios = document.getElementsByName("activity-" + idx);
  for (const r of radios) { if (r.checked && r.value === "yes") hasActivity = true; }

  const total = duration + (hasActivity ? 1 : 0);
  const pay = rate * total;
  document.getElementById("info-pay-" + idx).textContent = pay.toFixed(2) + " AUD";
}

/* ====================================================================== */
/*  FORM: Print & Submit                                                   */

function printRegisterForm() {
  window.print();
}

function submitRegistration() {
  const dateVal = document.getElementById("reg-date").value;
  if (!dateVal) { showToast("请先选择日期", "error"); return; }

  const startVal = document.getElementById("semester-start").value;
  const d = new Date(dateVal);
  const s = new Date(startVal);
  const diffDays = Math.floor((d - s) / (1000 * 60 * 60 * 24));
  const week = diffDays >= 0 ? Math.floor(diffDays / 7) + 1 : 0;

  const entries = [];
  for (let i = 1; i <= courseEntryCount; i++) {
    const entry = document.getElementById("entry-" + i);
    if (!entry) continue;
    const sel = document.getElementById("course-select-" + i);
    if (!sel || sel.value === "") continue;

    const c = COURSE_DATA[parseInt(sel.value)];
    const duration = calcDuration(c.start, c.end);

    let hasActivity = false;
    const radios = document.getElementsByName("activity-" + i);
    for (const r of radios) { if (r.checked && r.value === "yes") hasActivity = true; }

    const classDate = (document.getElementById("class-date-" + i) || {}).value || "";
    const unitRate = effectiveRate(i);
    const totalHours = duration + (hasActivity ? 1 : 0);
    const payment = unitRate * totalHours;
    const remarks = (document.getElementById("remarks-" + i) || {}).value || "";

    entries.push({
      courseCode: c.code,
      courseName: c.name,
      tutorial: c.tutorial,
      day: c.day,
      startTime: c.start,
      endTime: c.end,
      duration: duration,
      hasActivity: hasActivity,
      extraHours: hasActivity ? 1 : 0,
      totalHours: totalHours,
      classDate: classDate,
      unitRate: unitRate,
      payment: payment,
      remarks: remarks
    });
  }

  if (entries.length === 0) { showToast("请至少添加一门课程", "error"); return; }

  const record = {
    id: Date.now(),
    date: dateVal,
    week: week,
    entries: entries,
    submittedAt: new Date().toISOString()
  };

  const records = getRecords();
  records.push(record);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));

  showToast("提交成功！已保存到汇总登记", "success");
  // reset form
  setTimeout(() => {
    clearForm();
  }, 800);
}

function clearForm() {
  document.getElementById("reg-date").value = "";
  document.getElementById("reg-week").textContent = "—";
  document.getElementById("course-entries").innerHTML = "";
  courseEntryCount = 0;
  addCourseEntry();
}

/* ====================================================================== */
/*  STORAGE                                                                */
/* ====================================================================== */
function getRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveRecords(arr) { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }

/* ====================================================================== */
/*  SUMMARY RENDERING                                                      */
/* ====================================================================== */
function renderSummary() {
  const container = document.getElementById("summary-container");
  const records = getRecords();

  if (records.length === 0) {
    container.innerHTML = '<div class="empty-summary">暂无登记记录，请先在「信息登记」中提交。</div>';
    return;
  }

  // group by week
  const weekMap = {};
  for (const r of records) {
    const w = r.week;
    if (!weekMap[w]) weekMap[w] = [];
    weekMap[w].push(r);
  }

  // sort weeks ascending
  const weeks = Object.keys(weekMap).map(Number).sort((a, b) => a - b);

  let html = "";
  for (const w of weeks) {
    const recs = weekMap[w];
    // sort records within a week by date
    recs.sort((a, b) => a.date.localeCompare(b.date));

    let weekTotalHours = 0;
    let weekTotalCourses = 0;
    let weekTotalPay = 0;

    // build table rows
    let rowsHtml = "";
    for (const r of recs) {
      for (const e of r.entries) {
        weekTotalHours += e.totalHours;
        weekTotalCourses++;
        weekTotalPay += (e.payment || 0);
        const unitRateTxt = e.unitRate !== undefined ? e.unitRate + " AUD/h" : "—";
        const payTxt = e.payment !== undefined ? e.payment.toFixed(2) + " AUD" : "—";
        rowsHtml += `
          <tr>
            <td>${e.classDate || r.date}</td>
            <td>${e.courseCode}</td>
            <td class="left-align">${e.courseName}</td>
            <td>${e.tutorial}</td>
            <td>${e.day}</td>
            <td>${e.startTime} - ${e.endTime}</td>
            <td>${e.duration} h</td>
            <td>${e.hasActivity ? "是" : "否"}</td>
            <td>${e.extraHours} h</td>
            <td><strong>${e.totalHours} h</strong></td>
            <td>${unitRateTxt}</td>
            <td><strong>${payTxt}</strong></td>
            <td class="left-align">${escapeHtml(e.remarks) || "—"}</td>
            <td class="row-action no-print"><button class="btn btn-danger btn-sm" onclick="deleteRecord(${r.id})">删除</button></td>
          </tr>`;
      }
    }

    html += `
      <div class="week-group" data-week="${w}">
        <div class="week-group-header">
          <input type="checkbox" class="week-checkbox" value="${w}" checked>
          <span class="week-title">第 ${w} 周</span>
          <span class="week-total">共 ${weekTotalCourses} 门课程 | 合计 ${weekTotalHours} 小时 | 酬劳 ${weekTotalPay.toFixed(2)} AUD</span>
        </div>
        <div class="week-group-body">
          <table>
            <thead>
              <tr>
                <th>上课日期</th>
                <th>课程代码</th>
                <th>课程名称</th>
                <th>Tutorial</th>
                <th>星期</th>
                <th>上课时间</th>
                <th>上课时长</th>
                <th>课程活动</th>
                <th>额外时长</th>
                <th>总时长</th>
                <th>单位酬劳</th>
                <th>本课程酬劳</th>
                <th>备注</th>
                <th class="no-print">操作</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        <div class="summary-total-bar">
          <span class="label">本周合计：</span>
          <span class="value">${weekTotalCourses} 门课程 / ${weekTotalHours} 小时 / ${weekTotalPay.toFixed(2)} AUD</span>
        </div>
      </div>`;
  }

  container.innerHTML = html;
}

function toggleAllWeeks(el) {
  document.querySelectorAll(".week-checkbox").forEach(cb => { cb.checked = el.checked; });
}

function deleteRecord(id) {
  let records = getRecords();
  records = records.filter(r => r.id !== id);
  saveRecords(records);
  renderSummary();
  showToast("已删除该条记录", "success");
}

function clearAllRecords() {
  if (getRecords().length === 0) { showToast("无记录可清空", "error"); return; }
  if (!confirm("确认清空全部登记记录？此操作不可撤销。")) return;
  localStorage.removeItem(STORAGE_KEY);
  renderSummary();
  showToast("已清空全部记录", "success");
}

/* ====================================================================== */
/*  PDF EXPORT                                                             */
/* ====================================================================== */
function exportSelectedPDF() {
  const checked = document.querySelectorAll(".week-checkbox:checked");
  if (checked.length === 0) { showToast("请至少选中一个周", "error"); return; }
  const selectedWeeks = Array.from(checked).map(cb => parseInt(cb.value));
  exportPDF(selectedWeeks);
}

function exportAllPDF() {
  const records = getRecords();
  if (records.length === 0) { showToast("无记录可导出", "error"); return; }
  const allWeeks = [...new Set(records.map(r => r.week))].sort((a, b) => a - b);
  exportPDF(allWeeks);
}

function exportPDF(weeks) {
  const records = getRecords();
  const weekMap = {};
  for (const r of records) {
    if (!weeks.includes(r.week)) continue;
    if (!weekMap[r.week]) weekMap[r.week] = [];
    weekMap[r.week].push(r);
  }

  const sortedWeeks = Object.keys(weekMap).map(Number).sort((a, b) => a - b);

  let grandCourses = 0;
  let grandHours = 0;
  let grandPay = 0;

  let body = "";
  for (const w of sortedWeeks) {
    const recs = weekMap[w];
    recs.sort((a, b) => a.date.localeCompare(b.date));
    let weekCourses = 0;
    let weekHours = 0;
    let weekPay = 0;

    let rows = "";
    for (const r of recs) {
      for (const e of r.entries) {
        weekCourses++;
        weekHours += e.totalHours;
        weekPay += (e.payment || 0);
        const unitRateTxt = e.unitRate !== undefined ? e.unitRate + " AUD/h" : "—";
        const payTxt = e.payment !== undefined ? e.payment.toFixed(2) + " AUD" : "—";
        rows += `<tr>
          <td style="text-align:center;">${e.classDate || r.date}</td>
          <td style="text-align:center;">${e.courseCode}</td>
          <td style="text-align:left;">${e.courseName}</td>
          <td style="text-align:center;">${e.tutorial}</td>
          <td style="text-align:center;">${e.day}</td>
          <td style="text-align:center;">${e.startTime}-${e.endTime}</td>
          <td style="text-align:center;">${e.duration} h</td>
          <td style="text-align:center;">${e.hasActivity ? "是" : "否"}</td>
          <td style="text-align:center;">${e.extraHours} h</td>
          <td style="text-align:center;font-weight:700;">${e.totalHours} h</td>
          <td style="text-align:center;">${unitRateTxt}</td>
          <td style="text-align:center;font-weight:700;">${payTxt}</td>
          <td style="text-align:left;">${escapeHtml(e.remarks) || "—"}</td>
        </tr>`;
      }
    }

    grandCourses += weekCourses;
    grandHours += weekHours;
    grandPay += weekPay;

    body += `
      <div style="margin-bottom:20px;page-break-inside:avoid;">
        <h3 style="font-size:1rem;margin:16px 0 8px;color:#1e3a5f;">第 ${w} 周 <span style="font-size:.82rem;color:#0d9488;font-weight:600;margin-left:12px;">共 ${weekCourses} 门课程 | 合计 ${weekHours} 小时 | 酬劳 ${weekPay.toFixed(2)} AUD</span></h3>
        <table style="width:100%;border-collapse:collapse;font-size:.72rem;">
          <thead>
            <tr style="background:#f0f0f0;">
              <th style="padding:6px 8px;border:1px solid #ccc;">上课日期</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">课程代码</th>
              <th style="padding:6px 8px;border:1px solid #ccc;text-align:left;">课程名称</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">Tutorial</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">星期</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">上课时间</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">上课时长</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">课程活动</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">额外时长</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">总时长</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">单位酬劳</th>
              <th style="padding:6px 8px;border:1px solid #ccc;">本课程酬劳</th>
              <th style="padding:6px 8px;border:1px solid #ccc;text-align:left;">备注</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  // Build full print page
  const printHtml = `
    <div style="text-align:center;margin-bottom:24px;">
      <h1 style="font-size:1.3rem;margin-bottom:6px;">代替出席信息确认 — 汇总报告</h1>
      <p style="font-size:.82rem;color:#666;">导出日期：${new Date().toLocaleDateString("zh-CN")}</p>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:30px;margin-bottom:16px;font-size:.88rem;">
      <span>总课程数：<strong>${grandCourses}</strong> 门</span>
      <span>总工作时长：<strong style="color:#16a34a;">${grandHours}</strong> 小时</span>
      <span>总酬劳：<strong style="color:#d97706;">${grandPay.toFixed(2)}</strong> AUD</span>
    </div>
    ${body}
    <!-- Signature area -->
    <div style="display:flex;justify-content:flex-end;margin-top:50px;padding-top:24px;border-top:1.5px solid #333;">
      <div style="text-align:left;width:220px;">
        <div style="font-size:.85rem;color:#333;margin-bottom:36px;">确认人签字：</div>
        <div style="width:200px;border-bottom:1px solid #333;height:1px;margin-bottom:4px;"></div>
        <div style="font-size:.72rem;color:#999;">日期：</div>
      </div>
    </div>
  `;

  // Write to a hidden iframe and print
  printToPDF(printHtml);
}

function printToPDF(htmlContent) {
  const iframe = document.createElement("iframe");
  iframe.style.position = "fixed";
  iframe.style.right = "0";
  iframe.style.bottom = "0";
  iframe.style.width = "0";
  iframe.style.height = "0";
  iframe.style.border = "0";
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="UTF-8">
    <title>代替出席信息确认 — 汇总报告</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 30px; color: #1e293b; }
      table { width: 100%; border-collapse: collapse; font-size: .78rem; }
      th, td { padding: 6px 8px; border: 1px solid #ccc; }
      th { background: #f0f0f0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @media print { body { padding: 15px; } @page { margin: 15mm; } }
    </style>
    </head>
    <body>${htmlContent}</body>
    </html>
  `);
  doc.close();

  iframe.onload = function() {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(() => { document.body.removeChild(iframe); }, 1000);
  };
}

/* ====================================================================== */
/*  UTILITIES                                                             */
/* ====================================================================== */
function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (type || "");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

/*  INIT                                                                   */
/* ====================================================================== */
document.addEventListener("DOMContentLoaded", function() {
  // Set today's date as default
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("reg-date").value = today;
  updateWeek();

  // Restore session if any
  const session = getSession();
  if (session && USERS[session.username]) {
    currentUser = { username: session.username, role: session.role, label: session.label };
    enterApp();
  } else {
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("login-username").focus();
  }
});
</script>
